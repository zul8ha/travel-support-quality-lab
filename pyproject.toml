[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-support-quality-lab"
version = "0.1.0"
description = "A compact quality-engineering showcase for a travel support workflow."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "playwright>=1.50,<2.0",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
markers = [
  "e2e: browser end-to-end tests",
]
